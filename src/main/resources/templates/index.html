
<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlmCoder - Java Coding Agent</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --success: #3fb950;
            --panel-bg: #161b22;
            --input-bg: #0d1117;
            --code-bg: #1a1f2b;
            --header-bg: #161b22;
            --hover-bg: #1c2333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
        .project-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-left: auto;
        }
        .project-bar input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            width: 220px;
        }
        .project-bar input::placeholder { color: #484f58; }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        button:hover { background: var(--accent-hover); }
        button.danger { background: var(--danger); }
        button.danger:hover { background: #da3633; }
        button.small { padding: 3px 7px; font-size: 11px; }
        button.ghost { background: transparent; border: 1px solid var(--border); color: var(--fg); }
        button.ghost:hover { background: var(--hover-bg); }
        select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }
        select:focus { border-color: var(--accent); }
        .api-key-wrapper { display: flex; align-items: center; gap: 3px; }
        .api-key-wrapper input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            width: 170px;
            outline: none;
        }
        .api-key-wrapper input:focus { border-color: var(--accent); }
        .toggle-key {
            background: transparent;
            color: #8b949e;
            border: 1px solid var(--border);
            padding: 3px 7px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }
        .toggle-key:hover { color: var(--fg); }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .conv-sidebar {
            width: 260px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .conv-sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .conv-sidebar-header .row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .conv-sidebar-header input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }
        .conv-sidebar-header input:focus { border-color: var(--accent); }
        .conv-sidebar-header input::placeholder { color: #484f58; }
        .conv-list {
            flex: 1;
            overflow-y: auto;
        }
        .conv-item {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(48,54,61,0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
        }
        .conv-item:hover { background: var(--hover-bg); }
        .conv-item.active { background: rgba(88,166,255,0.1); border-left: 3px solid var(--accent); }
        .conv-item .title {
            font-size: 13px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .conv-item .time {
            font-size: 10px;
            color: #8b949e;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .conv-item .del-btn {
            background: none;
            border: none;
            color: #484f58;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            margin-left: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .conv-item:hover .del-btn { opacity: 1; }
        .conv-item .del-btn:hover { color: var(--danger); }
        .code-sidebar {
            width: 260px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .code-sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
        }
        .code-panel {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            background: var(--code-bg);
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
        }
        .message.agent {
            align-self: flex-start;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }
        .message.agent pre {
            background: var(--code-bg);
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 6px 0;
            font-size: 12px;
        }
        .message.system {
            align-self: center;
            background: transparent;
            color: #8b949e;
            font-size: 12px;
        }
        .chat-input-area {
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
        }
        .chat-input-area textarea {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--fg);
            padding: 10px;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
        }
        .chat-input-area textarea::placeholder { color: #484f58; }
        .status-bar {
            padding: 5px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: #8b949e;
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }
        .status-bar .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 3px;
        }
        .dot.connected { background: var(--success); }
        .dot.disconnected { background: var(--danger); }
        .stats { margin-left: auto; color: #58a6ff; }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #484f58;
            gap: 8px;
            font-size: 13px;
        }
        .loading-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.2s infinite;
            margin-left: 2px;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
    </style>
</head>
<body>
    <header>
        <h1>GlmCoder</h1>
        <select id="modelSelect" onchange="onModelChange()">
            <option value="glm-4-flash">glm-4-flash</option>
            <option value="glm-4.7-flash">glm-4.7-flash</option>
        </select>
        <div class="api-key-wrapper">
            <input type="password" id="apiKeyInput" placeholder="API Key">
            <button class="toggle-key" id="toggleKeyBtn" onclick="toggleApiKey()">显示</button>
        </div>
        <div class="project-bar">
            <input type="text" id="projectPath" placeholder="项目路径" value="/workspace/GlmCoder">
            <button id="openProjectBtn" onclick="openProject()">打开项目</button>
            <button id="indexBtn" onclick="indexProject()" class="danger" style="display:none;">索引</button>
        </div>
    </header>
    <div class="container">
        <div class="conv-sidebar">
            <div class="conv-sidebar-header">
                <div class="row">
                    <input type="text" id="searchInput" placeholder="搜索对话..."
                        oninput="searchConversations()">
                </div>
                <button onclick="newConversation()" class="ghost" style="width:100%;">+ 新建对话</button>
            </div>
            <div class="conv-list" id="convList">
                <div class="empty-state">
                    <span>打开项目后</span>
                    <span>自动显示对话列表</span>
                </div>
            </div>
        </div>
        <div class="code-sidebar">
            <div class="code-sidebar-header">代码结构</div>
            <div class="code-panel" id="codePanel">
                <span style="color:#8b949e;">打开项目后自动显示代码结构</span>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <span>打开项目，选择或新建对话</span>
                    <span>开始编码对话</span>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="chatInput" placeholder="输入编码任务（Enter 发送，Shift+Enter 换行）" rows="1"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            </div>
            <div class="status-bar">
                <span><span class="dot disconnected" id="statusDot"></span> <span id="statusText">未连接</span></span>
                <span class="stats" id="statsText"></span>
            </div>
        </div>
    </div>

    <script>
        let projectId = null;
        let currentConvId = null;
        let searchTimer = null;

        async function loadConfig() {
            try {
                const res = await fetch('/ui/config');
                const data = await res.json();
                document.getElementById('modelSelect').value = data.model;
                if (data.apiKey) {
                    document.getElementById('apiKeyInput').value = data.apiKey;
                }
            } catch (e) {
                console.log('loadConfig failed');
            }
        }

        async function saveConfig() {
            const model = document.getElementById('modelSelect').value;
            const apiKey = document.getElementById('apiKeyInput').value;
            const params = new URLSearchParams();
            params.append('model', model);
            if (apiKey && apiKey !== '****') {
                params.append('apiKey', apiKey);
            }
            try {
                const res = await fetch('/ui/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    document.getElementById('apiKeyInput').value = data.apiKey;
                }
            } catch (e) {}
        }

        function onModelChange() { saveConfig(); }

        function toggleApiKey() {
            const input = document.getElementById('apiKeyInput');
            const btn = document.getElementById('toggleKeyBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '隐藏';
            } else {
                input.type = 'password';
                btn.textContent = '显示';
            }
        }

        document.getElementById('apiKeyInput').addEventListener('change', function() { saveConfig(); });
        loadConfig();

        function updateStatus(connected, text) {
            const dot = document.getElementById('statusDot');
            dot.className = 'dot ' + (connected ? 'connected' : 'disconnected');
            document.getElementById('statusText').textContent = text;
        }

        async function openProject() {
            const path = document.getElementById('projectPath').value.trim();
            if (!path) return;
            addSysMsg('正在打开项目: ' + path + '...');
            try {
                const res = await fetch('/ui/project/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'path=' + encodeURIComponent(path)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    projectId = data.projectId;
                    updateStatus(true, '项目已打开');
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('indexBtn').style.display = 'inline-block';
                    loadStructure();
                    loadConversations();
                } else {
                    addSysMsg('错误: ' + data.message);
                }
            } catch (e) {
                addSysMsg('连接失败: ' + e.message);
            }
        }

        async function loadConversations(keyword) {
            if (!projectId) return;
            try {
                let url = '/api/conversations?projectId=' + projectId;
                if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
                const res = await fetch(url);
                const data = await res.json();
                if (data.status === 'ok') {
                    renderConvList(data.conversations);
                }
            } catch (e) {
                console.error('loadConversations failed', e);
            }
        }

        function searchConversations() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                const kw = document.getElementById('searchInput').value.trim();
                loadConversations(kw);
            }, 300);
        }

        function renderConvList(conversations) {
            const el = document.getElementById('convList');
            if (!conversations || conversations.length === 0) {
                el.innerHTML = '<div class="empty-state"><span>暂无对话</span><span>发送消息自动保存</span></div>';
                return;
            }
            el.innerHTML = conversations.map(c => {
                const active = c.id === currentConvId ? ' active' : '';
                const time = formatTime(c.updatedAt || c.createdAt);
                const title = escapeHtml(c.title || '新对话');
                return `<div class="conv-item${active}" onclick="selectConversation('${c.id}')">
                    <span class="title">${title}</span>
                    <span class="time">${time}</span>
                    <button class="del-btn" onclick="deleteConversation(event, '${c.id}')">&times;</button>
                </div>`;
            }).join('');
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const diffMs = now - d;
            if (diffMs < 60000) return '刚刚';
            if (diffMs < 3600000) return Math.floor(diffMs / 60000) + '分钟前';
            if (diffMs < 86400000) return Math.floor(diffMs / 3600000) + '小时前';
            return d.getMonth() + 1 + '/' + d.getDate();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function selectConversation(id) {
            currentConvId = id;
            document.getElementById('chatMessages').innerHTML = '';
            try {
                const res = await fetch('/api/conversations/' + id + '/messages');
                const data = await res.json();
                if (data.status === 'ok' && data.messages) {
                    data.messages.forEach(m => addMessage(m.role, m.content));
                }
            } catch (e) {
                addSysMsg('加载对话历史失败: ' + e.message);
            }
            loadConversations(document.getElementById('searchInput').value.trim() || null);
        }

        async function newConversation() {
            if (!projectId) return;
            currentConvId = null;
            document.getElementById('chatMessages').innerHTML = '';
            addSysMsg('新对话已创建，发送消息后自动保存');
        }

        async function deleteConversation(event, id) {
            event.stopPropagation();
            if (!confirm('确定要删除这个对话吗？')) return;
            try {
                await fetch('/api/conversations/' + id, { method: 'DELETE' });
                if (currentConvId === id) {
                    currentConvId = null;
                    document.getElementById('chatMessages').innerHTML = '';
                    addSysMsg('对话已删除');
                }
                loadConversations(document.getElementById('searchInput').value.trim() || null);
            } catch (e) {
                addSysMsg('删除失败: ' + e.message);
            }
        }

        async function loadStructure() {
            if (!projectId) return;
            try {
                const res = await fetch('/api/structure?projectId=' + projectId);
                const data = await res.json();
                if (data.status === 'ok') {
                    document.getElementById('codePanel').textContent = data.summary;
                }
            } catch (e) {}
        }

        function addSysMsg(text) {
            const el = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message system';
            div.textContent = text;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
        }

        function addMessage(role, text) {
            const el = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
        }

        async function indexProject() {
            if (!projectId) return;
            addSysMsg('正在索引项目代码...');
            try {
                const res = await fetch('/api/index?projectId=' + projectId, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    addSysMsg('索引完成: ' + data.classes + ' 个类, ' + data.methods + ' 个方法');
                    document.getElementById('statsText').textContent = data.classes + ' classes | ' + data.methods + ' methods';
                    loadStructure();
                } else {
                    addSysMsg('索引失败: ' + (data.message || '未知错误'));
                }
            } catch (e) {
                addSysMsg('索引失败: ' + e.message);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || !projectId) return;

            input.value = '';
            input.style.height = 'auto';

            addMessage('user', message);

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message system';
            loadingDiv.innerHTML = '处理中<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
            document.getElementById('chatMessages').appendChild(loadingDiv);
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;

            try {
                const formData = new URLSearchParams();
                formData.append('projectId', projectId);
                formData.append('message', message);
                if (currentConvId) {
                    formData.append('conversationId', currentConvId);
                }

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                const data = await res.json();

                loadingDiv.remove();

                if (data.status === 'ok') {
                    addMessage('agent', data.response);

                    if (data.conversationId) {
                        currentConvId = data.conversationId;
                    }
                    loadConversations(document.getElementById('searchInput').value.trim() || null);
                } else {
                    addSysMsg('错误: ' + data.message);
                }
            } catch (e) {
                loadingDiv.remove();
                addSysMsg('请求失败: ' + e.message);
            }
        }
    </script>
</body>
</html>
